<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #7d8590;
      --accent: #2f81f7;
      --green: #238636;
      --red: #da3633;
      --orange: #fb8500;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      height: 100vh; 
      display: flex; 
      flex-direction: column;
    }
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header .logo { font-size: 24px; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .header p { font-size: 13px; color: var(--text-secondary); }
    
    .chat-container { 
      flex: 1; 
      overflow-y: auto; 
      padding: 24px; 
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .msg { 
      display: flex; 
      gap: 12px; 
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
    .msg .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .msg.user .avatar { background: var(--accent); }
    .msg.ai .avatar { background: var(--green); }
    .msg .content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      line-height: 1.6;
      font-size: 15px;
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .content { background: var(--accent); border: none; }
    .msg .content img { 
      max-width: 100%; 
      border-radius: 8px; 
      margin-top: 12px;
      border: 1px solid var(--border);
    }
    .msg .content pre {
      background: var(--bg);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid var(--border);
    }
    
    .input-wrapper {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
    }
    .input-box {
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .preview {
      display: none;
      padding: 8px;
    }
    .preview.show { display: block; }
    .preview img { 
      max-height: 100px; 
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .input-main {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      resize: none;
      max-height: 200px;
      padding: 8px;
      outline: none;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      padding: 0 8px 8px 8px;
    }
    button, .upload-btn {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover, .upload-btn:hover { background: #484f58; }
    button.primary { background: var(--accent); }
    button.primary:hover { background: #1f6feb; }
    button.green { background: var(--green); }
    button.green:hover { background: #2ea043; }
    button.orange { background: var(--orange); color: #000; }
    button.orange:hover { background: #ffb347; }
    #fileInput { display: none; }
    .loading { opacity: 0.6; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">⚡</div>
    <div>
      <h1>LanAI Pro</h1>
      <p>AI Chat + Image Editor by Lan Bandung</p>
    </div>
  </header>

  <main class="chat-container" id="chat"></main>

  <div class="input-wrapper">
    <div class="input-box">
      <div class="preview" id="preview"></div>
      <div class="input-main">
        <textarea id="input" rows="1" placeholder="Ketik pesan atau perintah edit gambar..." onkeydown="handleKey(event)"></textarea>
        <button class="primary" onclick="kirimChat()" id="sendBtn">Kirim</button>
      </div>
      <div class="btn-group">
        <label for="fileInput" class="upload-btn">📁 Upload Gambar</label>
        <input type="file" id="fileInput" accept="image/*">
        <button class="green" onclick="generateGambar()">🎨 Buat Gambar</button>
        <button class="orange" onclick="editGambar()">✨ Edit Gambar</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const sendBtn = document.getElementById('sendBtn');
    
    let gambarUpload = null;
    let chatHistory = [];
    
    // SYSTEM PROMPT BARU - PINTER + RAPIH
    const SYSTEM_PROMPT = `Anda adalah LanAI Pro, asisten AI profesional buatan Lan dari Bandung.

ATURAN KOMUNIKASI:
1. Gunakan Bahasa Indonesia yang baik, jelas, dan terstruktur.
2. Jawab to the point. Jangan bertele-tele.
3. Gunakan format markdown untuk kerapihan: **bold**, \`code\`, list dengan -.
4. Jika user mengupload gambar, analisis dulu gambarnya sebelum kasih saran edit.
5. Jika tidak tahu, katakan "Maaf, saya belum memiliki informasi itu". Jangan mengarang.
6. Nada bicara: profesional tapi ramah. Boleh santai kalau user santai duluan.

KEMAMPUAN:
- Menjawab pertanyaan umum
- Memberi ide edit gambar
- Menulis kode HTML/CSS/JS
- Analisis masalah

Anda TIDAK BISA edit gambar langsung. Anda hanya memberi prompt untuk generate gambar baru.`;

    // AUTO RESIZE TEXTAREA
    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirimChat();
      }
    }

    function tambahPesan(role, content, imgUrl = null) {
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      
      const avatar = role === 'user' ? '👤' : '⚡';
      let html = `<div class="avatar">${avatar}</div><div class="content">${formatText(content)}`;
      if (imgUrl) {
        html += `<img src="${imgUrl}" onclick="window.open('${imgUrl}')" style="cursor:pointer">`;
      }
      html += `</div>`;
      
      msg.innerHTML = html;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    function formatText(text) {
      // Basic markdown: **bold**, `code`, line breaks
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    }

    // UPLOAD GAMBAR
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        gambarUpload = e.target.result;
        preview.innerHTML = `<img src="${gambarUpload}"><small style="color:var(--text-secondary);margin-left:8px">${file.name}</small>`;
        preview.classList.add('show');
        tambahPesan('user', 'Saya upload gambar');
        tambahPesan('ai', 'Gambar diterima. Apa yang ingin Anda lakukan dengan gambar ini?\n\n**Contoh perintah:**\n- `Jadikan gaya anime`\n- `Hapus background`\n- `Ubah jadi foto tahun 90an`\n- `Tambahkan efek cahaya`');
      };
      reader.readAsDataURL(file);
    };

    // CHAT - PAKE MODEL MISTRAL LARGE (PINTER)
    async function kirimChat() {
      const pesan = input.value.trim();
      if (!pesan) return;
      
      tambahPesan('user', pesan);
      input.value = '';
      input.style.height = 'auto';
      
      chatHistory.push({ role: 'user', content: pesan });
      if (chatHistory.length > 10) chatHistory.shift();
      
      setLoading(true);
      
      try {
        const historyText = chatHistory.slice(-6).map(c => `${c.role}: ${c.content}`).join('\n');
        const prompt = `${SYSTEM_PROMPT}\n\nRiwayat:\n${historyText}\n\nAI:`;
        
        // PAKE MODEL MISTRAL - LEBIH PINTER DARI DEFAULT
        const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=mistral`;
        const res = await fetch(url);
        const jawaban = await res.text();
        
        const jawabanBersih = jawaban.replace(/^(AI:|LanAI Pro:)/i, '').trim();
        tambahPesan('ai', jawabanBersih);
        chatHistory.push({ role: 'assistant', content: jawabanBersih });
        
      } catch (e) {
        tambahPesan('ai', `Maaf, terjadi kesalahan: \`${e.message}\``);
      } finally {
        setLoading(false);
      }
    }

    // GENERATE GAMBAR BARU
    async function generateGambar() {
      const pesan = input.value.trim();
      if (!pesan) {
        tambahPesan('ai', 'Silakan tulis deskripsi gambar yang ingin dibuat terlebih dahulu.');
        return;
      }
      
      tambahPesan('user', pesan);
      input.value = '';
      input.style.height = 'auto';
      setLoading(true);
      
      try {
        // Tambahin quality prompt biar hasil bagus
        const promptFinal = `${pesan}, high quality, detailed, 8k, professional photography`;
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptFinal)}?width=1024&height=1024&nologo=true&enhance=true`;
        
        tambahPesan('ai', `Berikut gambar untuk: **${pesan}**`, imgUrl);
        
      } catch (e) {
        tambahPesan('ai', `Gagal membuat gambar: \`${e.message}\``);
      } finally {
        setLoading(false);
      }
    }

    // EDIT GAMBAR - GENERATE ULANG BERDASARKAN PERINTAH
    async function editGambar() {
      const pesan = input.value.trim();
      if (!gambarUpload) {
        tambahPesan('ai', 'Silakan upload gambar terlebih dahulu menggunakan tombol **📁 Upload Gambar**.');
        return;
      }
      if (!pesan) {
        tambahPesan('ai', 'Tulis perintah editnya. Contoh: `jadikan gaya anime`, `hapus background`');
        return;
      }
      
      tambahPesan('user', `Edit: ${pesan}`);
      input.value = '';
      input.style.height = 'auto';
      setLoading(true);
      
      try {
        // Karena Pollinations gak bisa edit langsung, kita generate ulang dengan prompt deskriptif
        const promptEdit = `Recreate this image with these changes: ${pesan}. High quality, detailed, maintain composition`;
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptEdit)}?width=1024&height=1024&nologo=true&enhance=true`;
        
        tambahPesan('ai', `Hasil edit dengan perintah: **${pesan}**\n\n*Catatan: Ini adalah hasil generate ulang oleh AI, bukan edit pixel langsung.*`, imgUrl);
        
      } catch (e) {
        tambahPesan('ai', `Gagal mengedit gambar: \`${e.message}\``);
      } finally {
        setLoading(false);
      }
    }

    function setLoading(status) {
      sendBtn.disabled = status;
      sendBtn.classList.toggle('loading', status);
      sendBtn.textContent = status ? 'Proses...' : 'Kirim';
    }

    // PESAN AWAL
    tambahPesan('ai', 'Halo! Saya **LanAI Pro**.\n\nSaya siap membantu Anda dengan:\n- Menjawab pertanyaan\n- Memberi ide edit gambar\n- Membuat gambar dari teks\n\nSilakan mulai chat atau upload gambar.');
  </script>
</body>
</html>
