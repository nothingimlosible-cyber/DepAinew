<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat Gratis</title>
  <style>
    body { font-family: Arial; background: #111; color: #fff; padding: 20px; margin: 0; }
    #chat { height: 70vh; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; }
    .user { text-align: right; margin: 8px 0; }
    .user span { background: #2563eb; padding: 8px 12px; border-radius: 12px; display: inline-block; }
    .ai { margin: 8px 0; }
    .ai span { background: #333; padding: 8px 12px; border-radius: 12px; display: inline-block; }
    .ai img { max-width: 100%; border-radius: 12px; margin-top: 8px; }
    .input-area { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; }
    button { padding: 10px 16px; border-radius: 8px; border: none; background: #2563eb; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <h2>AI Chat Gratis</h2>
  <div id="chat"></div>
  <div class="input-area">
    <input id="input" placeholder="Ketik pesan..." onkeypress="if(event.key==='Enter') kirim()">
    <button onclick="kirim()">Kirim</button>
    <button onclick="gambar()">Gambar</button>
  </div>

  <script src="https://js.puter.com/v2/"></script>
  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function tambahPesan(teks, tipe, imgUrl) {
      const div = document.createElement('div');
      div.className = tipe;
      if (imgUrl) {
        div.innerHTML = `<span>${teks}<br><img src="${imgUrl}"></span>`;
      } else {
        div.innerHTML = `<span>${teks}</span>`;
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function kirim() {
      const pesan = input.value.trim();
      if (!pesan) return;
      tambahPesan(pesan, 'user');
      input.value = '';
      
      const loading = document.createElement('div');
      loading.className = 'ai';
      loading.innerHTML = '<span>Mengetik...</span>';
      chat.appendChild(loading);

      const hasil = await puter.ai.chat(pesan);
      loading.remove();
      tambahPesan(hasil, 'ai');
    }

    async function gambar() {
      const pesan = input.value.trim();
      if (!pesan) return;
      tambahPesan(pesan, 'user');
      input.value = '';
      
      const loading = document.createElement('div');
      loading.className = 'ai';
      loading.innerHTML = '<span>Membuat gambar...</span>';
      chat.appendChild(loading);

      const hasil = await puter.ai.txt2img(pesan);
      loading.remove();
      tambahPesan('Gambar selesai:', 'ai', hasil.src);
    }
  </script>
</body>
</html>
