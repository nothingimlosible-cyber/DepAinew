<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanAi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #212121;
      --sidebar: #171717;
      --card: #2f2f2f;
      --border: #424242;
      --text: #ececec;
      --text-secondary: #b4b4b4;
      --accent: #10a37f;
      --user-bg: #2f2f2f;
      --ai-bg: #212121;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', -apple-system, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      height: 100vh; 
      display: flex;
      overflow: hidden;
    }
    
    /* SIDEBAR ALA GPT */
    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px;
    }
    .new-chat {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .new-chat:hover { background: var(--card); }
    .sidebar-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-secondary);
    }
    
    /* MAIN CHAT */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .chat-container { 
      flex: 1; 
      overflow-y: auto; 
      padding-bottom: 120px;
    }
    .msg-wrapper {
      border-bottom: 1px solid var(--border);
    }
    .msg { 
      max-width: 768px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      gap: 24px;
    }
    .msg.user { background: var(--user-bg); }
    .msg.ai { background: var(--ai-bg); }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
      font-size: 14px;
    }
    .msg.user .avatar { background: #5436da; }
    .msg.ai .avatar { background: var(--accent); }
    .content {
      flex: 1;
      line-height: 1.7;
      font-size: 16px;
    }
    .content p { margin-bottom: 16px; }
    .content p:last-child { margin-bottom: 0; }
    .content strong { font-weight: 600; }
    .content code {
      background: var(--card);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      font-family: 'Consolas', monospace;
    }
    .content pre {
      background: #000;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 16px 0;
      border: 1px solid var(--border);
    }
    .content pre code {
      background: transparent;
      padding: 0;
    }
    .content ul, .content ol {
      margin: 16px 0;
      padding-left: 24px;
    }
    .content li { margin-bottom: 8px; }
    .content img { 
      max-width: 100%; 
      border-radius: 8px; 
      margin: 16px 0;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    
    /* INPUT AREA */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, transparent, var(--bg) 40%);
      padding: 24px;
    }
    .input-box {
      max-width: 768px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .preview {
      display: none;
      padding: 8px;
      background: var(--bg);
      border-radius: 8px;
      align-items: center;
      gap: 8px;
    }
    .preview.show { display: flex; }
    .preview img { max-height: 60px; border-radius: 4px; }
    .preview .info { flex: 1; font-size: 13px; }
    .preview .remove {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
    }
    .input-main {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      resize: none;
      max-height: 200px;
      padding: 4px;
      outline: none;
    }
    textarea::placeholder { color: var(--text-secondary); }
    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .send-btn:hover:not(:disabled) { background: #0d8f6f; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .tools {
      display: flex;
      gap: 8px;
      padding: 0 4px;
    }
    .tool-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: var(--card); color: var(--text); }
    #fileInput { display: none; }
    
    /* WELCOME SCREEN */
    .welcome {
      max-width: 768px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }
    .welcome h1 {
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #10a37f, #1a7f64);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .welcome p { color: var(--text-secondary); margin-bottom: 32px; }
    .examples {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      text-align: left;
    }
    .example {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .example:hover { background: #3a3a3a; }
    .example h3 { font-size: 14px; margin-bottom: 8px; }
    .example p { font-size: 13px; margin: 0; }
    
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .examples { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <button class="new-chat" onclick="newChat()">
      <span>✨</span> New Chat
    </button>
    <div class="sidebar-footer">
      <strong>AiLan</strong><br>
      Powered by Pollinations AI<br>
      Made with ❤️ by Lan
    </div>
  </aside>

  <main class="main">
    <div class="chat-container" id="chat">
      <div class="welcome" id="welcome">
        <h1>AiLan</h1>
        <p>Asisten AI buatan Lan. Tanya apa aja, bikin gambar, edit foto, coding. Gratis.</p>
        <div class="examples">
          <div class="example" onclick="setPrompt('Jelaskan cara kerja roket dengan analogi sederhana')">
            <h3>🚀 Belajar</h3>
            <p>Jelaskan cara kerja roket</p>
          </div>
          <div class="example" onclick="setPrompt('Buatkan saya HTML landing page modern untuk toko kopi')">
            <h3>💻 Coding</h3>
            <p>Buatkan landing page</p>
          </div>
          <div class="example" onclick="setPrompt('Bikinin gambar kucing astronot di bulan')">
            <h3>🎨 Gambar</h3>
            <p>Bikinin gambar kucing astronot</p>
          </div>
          <div class="example" onclick="setPrompt('Kasih ide konten TikTok untuk jualan seblak')">
            <h3>💡 Ide</h3>
            <p>Kasih ide konten TikTok</p>
          </div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <div class="preview" id="preview"></div>
        <div class="input-main">
          <textarea id="input" rows="1" placeholder="Message AiLan..." onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" onclick="kirimChat()" id="sendBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
            </svg>
          </button>
        </div>
        <div class="tools">
          <label for="fileInput" class="tool-btn">
            📎 Attach
          </label>
          <input type="file" id="fileInput" accept="image/*">
          <button class="tool-btn" onclick="generateGambar()">🎨 Generate</button>
          <button class="tool-btn" onclick="editGambar()">✨ Edit</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const sendBtn = document.getElementById('sendBtn');
    const welcome = document.getElementById('welcome');
    
    let gambarUpload = null;
    let chatHistory = [];
    
    // SYSTEM PROMPT - RASA GPT-4
    const SYSTEM_PROMPT = `You are AiLan, a helpful AI assistant created by Lan from Bandung, Indonesia.

CORE PRINCIPLES:
1. Be helpful, harmless, and honest.
2. Answer in clear, well-structured Bahasa Indonesia.
3. Use markdown formatting: **bold**, \`inline code\`, \`\`\`code blocks\`\`\`, lists.
4. Be concise but thorough. Don't repeat yourself.
5. If you don't know something, say so. Don't hallucinate.
6. For code, always provide complete, working examples.
7. Be professional yet friendly. Adapt to user's tone.

CAPABILITIES:
- Answer questions on any topic
- Write and explain code
- Creative writing and brainstorming
- Analyze uploaded images
- Generate image prompts

You cannot edit images directly. You can only describe how to edit or generate new versions.`;

    input.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        kirimChat();
      }
    }

    function setPrompt(text) {
      input.value = text;
      input.focus();
    }

    function newChat() {
      chatHistory = [];
      chat.innerHTML = '';
      welcome.style.display = 'block';
      hapusGambar();
    }

    function tambahPesan(role, content, imgUrl = null) {
      welcome.style.display = 'none';
      
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper';
      
      const msg = document.createElement('div');
      msg.className = `msg ${role}`;
      
      const avatar = role === 'user' ? 'U' : 'AI';
      let html = `<div class="avatar">${avatar}</div><div class="content">${formatMarkdown(content)}`;
      if (imgUrl) {
        html += `<img src="${imgUrl}" onclick="window.open('${imgUrl}')" title="Klik untuk buka ukuran penuh">`;
      }
      html += `</div>`;
      
      msg.innerHTML = html;
      wrapper.appendChild(msg);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
    }

    function formatMarkdown(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
        .replace(/^\* (.+)/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/^\d+\. (.+)/gm, '<li>$1</li>')
        .replace(/\n\n/g, '</p><p>')
        .replace(/\n/g, '<br>')
        .replace(/^/, '<p>')
        .replace(/$/, '</p>');
    }

    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      if (file.size > 5 * 1024 * 1024) {
        alert('Ukuran gambar maksimal 5MB');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        gambarUpload = e.target.result;
        preview.innerHTML = `
          <img src="${gambarUpload}">
          <div class="info">
            <div style="font-weight:500">${file.name}</div>
            <div style="color:var(--text-secondary)">${(file.size/1024).toFixed(1)} KB</div>
          </div>
          <button class="remove" onclick="hapusGambar()">×</button>
        `;
        preview.classList.add('show');
      };
      reader.readAsDataURL(file);
    };

    function hapusGambar() {
      gambarUpload = null;
      preview.classList.remove('show');
      preview.innerHTML = '';
      fileInput.value = '';
    }

    // CHAT - MODEL PINTER ANTI QUEUE
    async function kirimChat() {
      const pesan = input.value.trim();
      if (!pesan && !gambarUpload) return;
      
      const displayMsg = pesan || 'Lihat gambar ini';
      tambahPesan('user', displayMsg);
      input.value = '';
      input.style.height = 'auto';
      
      chatHistory.push({ role: 'user', content: pesan });
      if (chatHistory.length > 12) chatHistory.shift();
      
      setLoading(true);
      
      try {
        const historyText = chatHistory.slice(-8).map(c => `${c.role}: ${c.content}`).join('\n');
        let prompt = `${SYSTEM_PROMPT}\n\nRiwayat percakapan:\n${historyText}\n\n`;
        
        if (gambarUpload) {
          prompt += `[User mengupload gambar. Berikan analisis atau saran edit.]\n\n`;
        }
        
        prompt += `assistant:`;
        
        // PAKE MODEL OPENAI-LARGE = PALING PINTER + GRATIS
        const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai-large&seed=${Date.now()}&json=false`;
        const res = await fetch(url);
        
        if (!res.ok) throw new Error(`API Error ${res.status}`);
        
        const jawaban = await res.text();
        const jawabanBersih = jawaban.replace(/^(assistant:|AI:)/i, '').trim();
        
        tambahPesan('ai', jawabanBersih);
        chatHistory.push({ role: 'assistant', content: jawabanBersih });
        
      } catch (e) {
        tambahPesan('ai', `Maaf, terjadi kesalahan: **${e.message}**\n\nSilakan coba lagi dalam beberapa detik.`);
      } finally {
        setLoading(false);
        hapusGambar();
      }
    }

    async function generateGambar() {
      const pesan = input.value.trim();
      if (!pesan) {
        tambahPesan('ai', 'Silakan tulis deskripsi gambar yang ingin dibuat terlebih dahulu.\n\n**Contoh:** `kucing astronot sedang main gitar di bulan, cinematic lighting, 8k`');
        return;
      }
      
      tambahPesan('user', pesan);
      input.value = '';
      input.style.height = 'auto';
      setLoading(true);
      
      try {
        const promptFinal = `${pesan}, masterpiece, best quality, ultra detailed, 8k`;
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptFinal)}?width=1024&height=1024&nologo=true&enhance=true&seed=${Date.now()}`;
        
        tambahPesan('ai', `Berikut hasil generate untuk: **${pesan}**`, imgUrl);
        
      } catch (e) {
        tambahPesan('ai', `Gagal membuat gambar: **${e.message}**`);
      } finally {
        setLoading(false);
      }
    }

    async function editGambar() {
      const pesan = input.value.trim();
      if (!gambarUpload) {
        tambahPesan('ai', 'Silakan upload gambar terlebih dahulu menggunakan tombol **📎 Attach**.');
        return;
      }
      if (!pesan) {
        tambahPesan('ai', 'Tulis perintah editnya.\n\n**Contoh:**\n- `ubah jadi gaya anime studio ghibli`\n- `hapus background jadi transparan`\n- `tambahkan efek cyberpunk neon`');
        return;
      }
      
      tambahPesan('user', `Edit: ${pesan}`);
      input.value = '';
      input.style.height = 'auto';
      setLoading(true);
      
      try {
        const promptEdit = `Recreate the uploaded image with these modifications: ${pesan}. Maintain original composition and quality. Masterpiece, ultra detailed, 8k`;
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptEdit)}?width=1024&height=1024&nologo=true&enhance=true&seed=${Date.now()}`;
        
        tambahPesan('ai', `Hasil edit dengan perintah: **${pesan}**\n\n*Catatan: Ini adalah hasil generate ulang oleh AI berdasarkan deskripsi Anda.*`, imgUrl);
        
      } catch (e) {
        tambahPesan('ai', `Gagal mengedit gambar: **${e.message}**`);
      } finally {
        setLoading(false);
        hapusGambar();
      }
    }

    function setLoading(status) {
      sendBtn.disabled = status;
      input.disabled = status;
    }
  </script>
</body>
</html>
